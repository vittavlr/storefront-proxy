<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F6;--card:#fff;--ink:#16211C;--soft:#66766C;--line:#DDE4DF;--accent:#1F5FA8;--ok:#2C6E49;--warn:#B4541B;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:Archivo,sans-serif;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
header .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{border:0;background:var(--line);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF1EE}
.row:last-child{border-bottom:0}
.stock{font-size:.78rem;padding:2px 8px;border-radius:999px}
.stock.ok{background:#ECF6F0;color:var(--ok)}
.stock.low{background:#FDF4EC;color:var(--warn)}
.stock.out{background:#FCECEE;color:#B02A37}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}
.btn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
.meta{color:var(--soft);font-size:.85rem}
.inv{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;background:var(--card)}
a.link{color:var(--accent);text-decoration:none;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--soft)}
.hide{display:none}
</style>
</head>
<body>
<header><div class="in">
  <h2 id="bizName">Loading…</h2>
  <nav>
    <button id="tabCatalog" class="on">Products</button>
    <button id="tabPurchases">My purchases</button>
  </nav>
</div></header>
<main class="wrap">
  <div id="viewCatalog"></div>
  <div id="viewPurchases" class="hide"></div>
</main>

<script>
/* ====== CONFIGURE THIS ONE VALUE ====== */
const PROXY_BASE = "https://storefront-proxy.onrender.com"; // where you deploy the proxy server (see ../proxy)
/* ======================================= */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path){
  const res = await fetch(`${PROXY_BASE}${path}`);
  if(!res.ok) throw new Error("Request failed");
  return res.json();
}

function stockBadge(stock){
  if(stock<=0) return `<span class="stock out">Out of stock</span>`;
  if(stock<=5) return `<span class="stock low">${stock} left</span>`;
  return `<span class="stock ok">${stock} in stock</span>`;
}

async function loadBusiness(){
  document.getElementById("bizName").textContent = "Storefront"; // edit this directly, or hardcode your shop name
}

async function loadCatalog(){
  const el = document.getElementById("viewCatalog");
  el.innerHTML = `<div class="empty">Loading products…</div>`;
  try{
    const products = await api("/products");
    if(!products.length){ el.innerHTML = `<div class="empty">No products listed yet.</div>`; return; }
    const byCat = {};
    products.forEach(p => (byCat[p.category] = byCat[p.category] || []).push(p));
    el.innerHTML = Object.keys(byCat).sort().map(cat => `
      <div class="card"><h3 style="margin-bottom:6px">${esc(cat)}</h3>
        ${byCat[cat].map(p => `<div class="row">
          <span>${esc(p.name)} <span class="meta">₹${p.price.toFixed(2)}/${esc(p.unit)}</span></span>
          ${stockBadge(p.stock)}
        </div>`).join("")}
      </div>`).join("");
  }catch(e){ el.innerHTML = `<div class="empty">Couldn't load products right now.</div>`; }
}

async function loadPurchases(phone){
  const el = document.getElementById("viewPurchases");
  el.innerHTML = `
    <div class="card">
      <label class="meta">Enter your phone number to see your orders and bills</label>
      <div style="display:flex;gap:8px;margin-top:6px">
        <input id="phoneInput" type="tel" placeholder="10-digit phone number" value="${esc(phone||"")}">
        <button class="btn" id="lookupBtn">Look up</button>
      </div>
    </div>
    <div id="invoiceResults"></div>`;
  document.getElementById("lookupBtn").onclick = () => runLookup(document.getElementById("phoneInput").value);
  document.getElementById("phoneInput").addEventListener("keydown", e=>{ if(e.key==="Enter") runLookup(e.target.value); });
  if(phone) runLookup(phone);
}

async function runLookup(phone){
  const box = document.getElementById("invoiceResults");
  box.innerHTML = `<div class="empty">Looking up your orders…</div>`;
  try{
    const invoices = await api(`/invoices?phone=${encodeURIComponent(phone)}`);
    if(!invoices.length){ box.innerHTML = `<div class="empty">No orders found for that number yet.</div>`; return; }
    box.innerHTML = invoices.map(inv => `
      <div class="inv">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>#${esc(inv.invoiceNumber)}</b>
          <span class="meta">${new Date(inv.date).toLocaleDateString()}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <span>Total ₹${inv.total.toFixed(2)} · Balance due ₹${inv.balanceDue.toFixed(2)} · ${esc(inv.status)}</span>
          ${inv.shareUrl ? `<a class="link" target="_blank" rel="noopener" href="${esc(inv.shareUrl)}">View bill →</a>` : `<span class="meta">Bill link unavailable</span>`}
        </div>
      </div>`).join("");
  }catch(e){ box.innerHTML = `<div class="empty">Couldn't look that up right now.</div>`; }
}

document.getElementById("tabCatalog").onclick = () => {
  document.getElementById("tabCatalog").classList.add("on");
  document.getElementById("tabPurchases").classList.remove("on");
  document.getElementById("viewCatalog").classList.remove("hide");
  document.getElementById("viewPurchases").classList.add("hide");
};
document.getElementById("tabPurchases").onclick = () => {
  document.getElementById("tabPurchases").classList.add("on");
  document.getElementById("tabCatalog").classList.remove("on");
  document.getElementById("viewPurchases").classList.remove("hide");
  document.getElementById("viewCatalog").classList.add("hide");
  if(!document.getElementById("phoneInput")) loadPurchases();
};

loadBusiness();
loadCatalog();
</script>
</body>
</html>
