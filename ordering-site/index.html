<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // Applied synchronously, before the page paints, so there's no flash of
  // the wrong theme. Always light on a first-ever visit — dark mode only
  // turns on once the visitor explicitly picks it via the toggle, and
  // that choice is then remembered for next time.
  (function(){
    try{
      if(localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme","dark");
      if(localStorage.getItem("textSize") === "lg") document.documentElement.setAttribute("data-textsize","lg");
    }catch(e){}
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Amman Mandi</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --card:#FFFFFF; --ink:#16211C; --soft:#66766C; --line:#DDE4DF; --line2:#EDF1EE;
  --accent:#1F5FA8; --ok:#2C6E49; --warn:#B4541B; --flag:#B02A37; --r:12px;
  --sh:0 1px 2px rgba(22,33,28,.06), 0 8px 24px rgba(22,33,28,.05);
  --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[data-textsize="lg"]{font-size:115%}
:root[data-theme="dark"]{
  --bg:#12161A; --card:#1B2026; --ink:#EAEDEF; --soft:#8B96A0; --line:#2A3038; --line2:#232830;
  --accent:#5B9BE0; --ok:#4FAE7B; --warn:#E08A4C; --flag:#E5707C;
  --sh:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body,.card,.slide,.slides-outer,header.top,.site-footer,nav,nav button,.brand,input,textarea,select,
.row,.rows,.spec,.quote,.inv,.reqcard,.admin-card,.field input,.field textarea,.compare,.compare th,.compare td,
.info div,.step,.step .qtyinput,.step button,.pill,.stock,.pagedots button,.theme-toggle,.tray,.map-embed{
  transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease);
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,Inter,sans-serif;letter-spacing:-.018em;margin:0;font-weight:600}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;line-height:1.08}
h2{font-size:1.3rem} h3{font-size:1rem}
p{margin:.35rem 0}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip-link{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:0 0 8px 0;z-index:200;font-weight:600;text-decoration:none}
.skip-link:focus{left:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background .35s var(--ease);
  background:
    radial-gradient(60vmax 60vmax at 8% -6%, rgba(180,101,27,.10), transparent 60%),
    radial-gradient(55vmax 55vmax at 100% 10%, rgba(31,95,168,.09), transparent 60%),
    radial-gradient(50vmax 50vmax at 20% 100%, rgba(44,110,73,.08), transparent 60%),
    repeating-linear-gradient(115deg, rgba(22,33,28,.025) 0 2px, transparent 2px 34px),
    var(--bg);
}

/* loader */
#loader{position:fixed;inset:0;z-index:100;background:#000;transition:opacity .5s var(--ease),visibility .5s var(--ease)}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
#loaderVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#loader #skipLoad{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border-color:rgba(255,255,255,.4);color:#fff}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(245,247,246,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
:root[data-theme="dark"] header.top{background:rgba(18,22,26,.88)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:Archivo;font-weight:700;font-size:.98rem;line-height:1.15;background:none;border:0;text-align:left;padding:0}
.brand small{display:block;font-family:Inter;font-weight:400;font-size:.72rem;color:var(--soft)}
.biz-switcher{font-size:.8rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--line2);color:var(--ink);max-width:170px}
@media(max-width:560px){.biz-switcher{max-width:110px;font-size:.74rem}}
/* Spotlight navbar — a vanilla port of the "SpotlightNavbar" component:
   a soft light follows the pointer along the bar, and a glowing line
   sits under the active tab. Both are positioned by the CSS variables
   --spotlight-x / --ambience-x, which the JS below springs around. */
nav{--spotlight-color:rgba(0,0,0,.08);--ambience-color:rgba(0,0,0,.8);
  position:relative;overflow:hidden;margin-left:auto;display:flex;gap:0;align-items:center;
  background:var(--line2);border:1px solid var(--line);padding:2px 6px;border-radius:999px}
:root[data-theme="dark"] nav{--spotlight-color:rgba(255,255,255,.15);--ambience-color:rgba(255,255,255,1)}
nav::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  background:radial-gradient(120px circle at var(--spotlight-x,50%) 100%,var(--spotlight-color) 0%,transparent 50%)}
nav.spot-on::before{opacity:1}
nav::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;z-index:2;pointer-events:none;
  background:radial-gradient(60px circle at var(--ambience-x,50%) 0%,var(--ambience-color) 0%,transparent 100%)}
nav.no-active::after{opacity:0}
nav button{position:relative;z-index:10;background:none;border:0;color:var(--soft);padding:9px 14px;border-radius:999px;font-size:.84rem;font-weight:500;transition:color .2s var(--ease)}
nav button:hover{color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav button[aria-current="true"]{color:var(--ink)}
.theme-toggle{margin-left:8px;flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:.95rem;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s var(--ease)}
.theme-toggle:hover{transform:rotate(15deg)}

/* theme switch — adapted from a uiverse.io slider toggle, retoned to the site's palette */
.theme-switch{margin-left:8px;position:relative;display:inline-block;width:3.1em;height:1.7em;flex:0 0 auto;cursor:pointer}
.theme-switch input{position:absolute;opacity:0;width:0;height:0}
.theme-slider{position:absolute;inset:0;background:var(--line2);border:1px solid var(--line);border-radius:30px;transition:background .3s var(--ease);display:flex;align-items:center;justify-content:space-between;padding:0 5px;box-sizing:border-box}
.theme-slider .theme-icon{font-size:.72em;line-height:1;opacity:.6;transition:opacity .3s var(--ease)}
.theme-slider::before{content:"";position:absolute;height:1.25em;width:1.25em;left:.2em;top:50%;transform:translateY(-50%);border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease),background .3s var(--ease)}
#themeToggle:checked + .theme-slider{background:var(--ink)}
#themeToggle:checked + .theme-slider::before{transform:translate(1.4em,-50%);background:var(--bg)}
#themeToggle:focus-visible + .theme-slider{outline:2px solid var(--accent);outline-offset:2px}
.floating-contact{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:35;
  width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;
  font-size:1.4rem;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.floating-contact:hover{transform:scale(1.08)}

/* full-page horizontal slider */
.slides-outer{position:relative;overflow:hidden;height:calc(100dvh - var(--headerH,54px) - env(safe-area-inset-top,0px));
  transition:opacity .25s var(--ease),transform .25s var(--ease)}
.slides-outer.biz-fade{opacity:.25;transform:scale(.985)}
.biz-switcher:disabled{opacity:.6}
.slides-track{display:flex;height:100%;transition:transform .55s var(--ease)}
.slide{flex:0 0 100vw;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.slide .wrap{max-width:1400px;margin:0 auto;padding:20px 16px 24px}
.slide[data-slide="products"] .wrap{padding-bottom:80px}
.slide[data-slide="home"] .wrap{padding-bottom:0}
.pagedots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:7px}
.pagedots button{width:7px;height:7px;border-radius:50%;background:var(--line);border:1px solid var(--card);padding:0;transition:background .2s var(--ease),height .2s var(--ease)}
.pagedots button[aria-current="true"]{background:var(--ink);height:20px;border-radius:4px}
@media(max-width:680px){.pagedots{display:none}}

.fade{animation:fade .3s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* landing sections */
.landing-hero{position:relative;overflow:hidden;border-radius:16px;padding:34px 24px;margin-top:4px;
  background:linear-gradient(135deg,#EFF6EE 0%,#F7F6EC 45%,#EAF1F8 100%);border:1px solid var(--line)}
:root[data-theme="dark"] .landing-hero{background:linear-gradient(135deg,#1B2620 0%,#211F1A 45%,#1A2430 100%)}
.landing-hero .k{display:inline-block;font-size:.76rem;color:var(--ok);background:#E4F3E9;border:1px solid #C7E5D2;padding:3px 10px;border-radius:999px;margin-bottom:12px}
:root[data-theme="dark"] .landing-hero .k{background:#1B3327;border-color:#2C4E3B}
.landing-hero h1{max-width:20ch}
.landing-hero p{max-width:52ch;color:var(--soft);font-size:1rem;margin-top:10px}
.landing-hero .grain{position:absolute;right:-30px;bottom:-40px;font-size:8rem;opacity:.09;transform:rotate(-8deg)}
.landing-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:9px;padding:10px 16px;font-weight:600;font-size:.9rem;
  transition:transform .16s var(--ease),background-color .3s var(--ease),color .3s var(--ease),box-shadow .25s var(--ease)}
/* subtle glow on hover — adapted from a uiverse.io button, retoned to the site's accent colour */
.btn:not(.ghost):hover{box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(31,95,168,.45),0 0 28px rgba(31,95,168,.22)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:.82rem;font-weight:500}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:22px}
.stat b{display:block;font-family:Archivo;font-size:1.4rem;font-weight:700}
.countup{font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--soft)}
.stat-loading{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.loademoji.mini{font-size:1.5rem;gap:8px;margin-bottom:0;justify-content:flex-start}

.section{margin-top:38px}
.section .kicker{font-size:.78rem;color:var(--ok);font-weight:600;margin-bottom:4px}
.section h2{font-size:1.4rem;max-width:26ch}
.section .sub{color:var(--soft);max-width:56ch;margin-top:6px}

.trust-row{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;margin-top:26px;padding:14px;background:var(--line2);border-radius:var(--r);font-size:.84rem;color:var(--soft);font-weight:500}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.featured-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;z-index:1;transition:transform .3s cubic-bezier(.175,.885,.32,1.275)}
/* gradient-border glow on hover — adapted from a uiverse.io card, retoned to the site's accent/ok colours */
.featured-card::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:calc(var(--r) + 2px);
  background:linear-gradient(-45deg,var(--accent),var(--ok));opacity:0;transition:opacity .4s var(--ease)}
.featured-card:hover{transform:translateY(-3px)}
.featured-card:hover::before{opacity:1}
.featured-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.featured-top .name{font-weight:600;font-size:.94rem}
.featured-price{font-family:Archivo;font-weight:700;font-size:1.05rem}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.spec .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;margin-bottom:8px}
:root[data-theme="dark"] .spec .ic{filter:brightness(.42) saturate(1.15)}
.spec p{font-size:.86rem;color:var(--soft);margin:2px 0 0}

.compare{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.compare table{width:100%;border-collapse:collapse;font-size:.88rem}
.compare th,.compare td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2)}
.compare tr:last-child td{border-bottom:0}
.compare thead th{background:var(--line2);font-family:Archivo;font-weight:600;font-size:.8rem;color:var(--soft)}
.compare th.us,.compare td.us{background:#EEF6F0;color:var(--ok);font-weight:600}
:root[data-theme="dark"] .compare th.us,
:root[data-theme="dark"] .compare td.us{background:#1B3327}
.compare .no{color:var(--soft)}

.quote-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.quote{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.quote .who{margin-top:8px;font-size:.8rem;color:var(--soft);font-weight:600}
.stars{color:#D9A441;font-size:.85rem}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.info div{background:var(--card);padding:12px 14px;font-size:.88rem}
.info span{display:block;font-size:.74rem;color:var(--soft);margin-bottom:2px}

.bandcta{margin-top:38px;border-radius:16px;padding:26px;text-align:center;background:linear-gradient(120deg,#16211C,#243A2E);color:#fff}
.bandcta h2{color:#fff}
.bandcta p{color:#C9D6CE;max-width:50ch;margin:8px auto 0}
.bandcta .btn{background:#fff;color:#16211C;margin-top:14px}
footer{margin-top:26px;padding:16px 0;color:var(--soft);font-size:.8rem;border-top:1px solid var(--line)}
.site-footer{margin-top:44px;background:var(--line2);color:var(--ink);width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;border-top:1px solid var(--line)}
.footer-inner{max-width:1400px;margin:0 auto;padding:13px 22px calc(13px + env(safe-area-inset-bottom,0px))}
.footer-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.9rem}
.footer-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
@media(max-width:620px){.footer-cols{grid-template-columns:1fr}}
.footer-details{display:flex;flex-direction:column;justify-content:space-evenly;height:100%}
.contact-line a{color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
.contact-line a:hover{text-decoration:underline}
.contact-line .dot{color:var(--soft)}
.address-block{margin-top:4px;line-height:1.4;color:var(--soft)}
.address-block .pin{display:inline-block;margin-left:4px;font-size:.76rem;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink)}
.map-embed{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-height:120px}
.map-embed iframe{width:100%;height:100%;min-height:120px;border:0;display:block}
.map-toggle{position:absolute;top:8px;right:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--ink);box-shadow:var(--sh)}
.map-toggle:hover{background:var(--line2)}
.footer-bottom{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);justify-content:space-between;color:var(--soft);font-size:.78rem}
.admin-access{font-size:.7rem;color:var(--soft);cursor:pointer;text-decoration:none}
.admin-access:hover{text-decoration:underline;color:var(--ink)}

/* products page */
.head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.head .rule{flex:1;height:1px;background:var(--line)}
.meta{font-size:.8rem;color:var(--soft)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:18px}
.row{display:flex;flex-direction:column;padding:10px 14px;border-bottom:1px solid var(--line2)}
.rowmain{display:flex;align-items:center;gap:12px}
.row:last-child{border-bottom:0}
.row .name{font-weight:500;font-size:.94rem}

/* extra-stock request (appears under a product once a quantity is chosen) */
.extra-box{margin-top:8px;padding:10px 12px;background:var(--line2);border-radius:10px;font-size:.84rem}
.maxnote{color:var(--warn);font-weight:500;margin-bottom:8px;line-height:1.4}
.extra-check{display:flex;align-items:center;gap:8px;margin:0;font-size:.84rem;color:var(--ink);cursor:pointer}
.extra-check input{width:16px;height:16px;margin:0;cursor:pointer}
.extra-total{margin-top:8px}
.extra-total label{margin:0 0 4px;font-size:.78rem}
.extra-total input{width:160px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.92rem}
.extra-hint{display:block;margin-top:6px;color:var(--soft);font-size:.78rem}
.pill.st-extra{background:#F3ECFA;border-color:#D9C7EE;color:#6A3FA0}
:root[data-theme="dark"] .pill.st-extra{background:#2E2440;border-color:#48355F;color:#C6A6EC}

/* request item with a stock part + an extra part */
.lines li.has-extra{display:block}
.xhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.xpart{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 4px 10px;margin-top:3px;border-left:2px solid var(--line)}
.xlabel{font-size:.74rem;color:var(--soft);min-width:68px}
.statsel{padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:.8rem;color:var(--ink)}
.row .rate{margin-left:auto;font-family:Archivo;font-weight:600;font-size:.9rem;white-space:nowrap}
.stock{font-size:.76rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.stock.ok{background:#ECF6F0;color:var(--ok)}
.stock.low{background:#FDF4EC;color:var(--warn)}
.stock.out{background:#FCECEE;color:var(--flag)}
:root[data-theme="dark"] .stock.ok{background:#1B3327}
:root[data-theme="dark"] .stock.low{background:#3A2B1C}
:root[data-theme="dark"] .stock.out{background:#3A2229}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--soft)}
.sk{background:linear-gradient(90deg,var(--line2) 25%,#F7FAF8 37%,var(--line2) 63%);background-size:400% 100%;animation:shine 1.3s linear infinite;border-radius:8px;height:46px;margin-bottom:8px}
:root[data-theme="dark"] .sk{background:linear-gradient(90deg,var(--line2) 25%,#2E353D 37%,var(--line2) 63%);background-size:400% 100%}
@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
.loadwrap{text-align:center;padding:36px 10px 24px}
.loademoji{font-size:2.3rem;display:flex;justify-content:center;gap:16px;margin-bottom:12px}
.loademoji span{display:inline-block;animation:sway 1.3s ease-in-out infinite}
.loademoji span:nth-child(2){animation-delay:.15s}
.loademoji span:nth-child(3){animation-delay:.3s}
@keyframes sway{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-7px)}}
.loadmsg{color:var(--soft);font-size:.92rem;min-height:1.3em;transition:opacity .3s var(--ease)}
/* WarpText loading message: a small canvas the shader draws the text into */
.warp-load{position:relative;display:block;width:min(100%,380px);height:56px;margin:0 auto;color:var(--ink);font-size:1.05rem;font-weight:600;letter-spacing:0;overflow:hidden;isolation:isolate}
.warp-load canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.warp-load .warp-fallback{display:flex;height:100%;align-items:center;justify-content:center;text-align:center}
.stat-loading .warp-load{margin:0;flex:1 1 auto;height:44px;min-width:0}

/* 3D pyramid loader — adapted from a uiverse.io loader, scaled down and
   retoned to the site's palette instead of the original purple/pink/teal */
.pyramid-loader{position:relative;width:56px;height:56px;margin:0 auto 14px;display:block;transform-style:preserve-3d;transform:rotateX(-20deg)}
.pyramid-wrapper{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:pyramid-spin 3.2s linear infinite}
@keyframes pyramid-spin{100%{transform:rotateY(360deg)}}
.pyramid-loader .side{width:28px;height:28px;position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;transform-origin:center top;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.pyramid-loader .side1{transform:rotateZ(-30deg) rotateY(90deg);background:conic-gradient(var(--ok),var(--accent),var(--line2),var(--ink))}
.pyramid-loader .side2{transform:rotateZ(30deg) rotateY(90deg);background:conic-gradient(var(--ink),var(--line2),var(--accent),var(--ok))}
.pyramid-loader .side3{transform:rotateX(30deg);background:conic-gradient(var(--ink),var(--line2),var(--accent),var(--ok))}
.pyramid-loader .side4{transform:rotateX(-30deg);background:conic-gradient(var(--ok),var(--accent),var(--line2),var(--ink))}
.pyramid-loader .pshadow{width:24px;height:24px;position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;background:var(--accent);transform:rotateX(90deg) translateZ(-16px);filter:blur(6px);opacity:.5}

<script>
/* ====== CONFIGURE ====== */
const PROXY_BASE_RAW = "https://storefront-proxy.onrender.com/"; // your deployed proxy (see ../proxy)
const PROXY_BASE = PROXY_BASE_RAW.replace(/\/+$/,""); // strip trailing slash so URLs never end up with "//"
// Fixed per-business contact details — the footer always shows these
// directly, regardless of what the proxy's saved content has (that storage
// can reset when the proxy is redeployed, which is fine for the editable
// marketing copy on the home page, but not acceptable for core contact
// info like phone/email/address). Edit this list to update either
// business's real contact details.
const FIXED_CONTACT = {
  gas: {
    phone: "+91 97516 55590",
    email: "srivenkateshwara20030@gmail.com",
    address: "15, Arni Road, Thuthipet, Vellore, Tamilnadu - 632011.",
    hours: "Mon–Sat 8am–8pm · Sun 8am–1pm",
  },
  rice: {
    phone: "+91 97516 55590",
    email: "srivenkateshwara20030@gmail.com",
    address: "15, Arni Road, Thuthipet, Vellore, Tamilnadu - 632011.",
    hours: "Mon–Sat 8am–8pm · Sun 8am–1pm",
  },
};
function fixedContact(){ return FIXED_CONTACT[S.biz] || Object.values(FIXED_CONTACT)[0]; }

const DEFAULT_SHOP = {
  name: "Sri Amman Sugar and Rice Mandi",
  tagline: "Sugar and Rice at Best Price!",
  phone: FIXED_CONTACT.rice.phone,
  email: FIXED_CONTACT.rice.email,
  hours: FIXED_CONTACT.rice.hours,
  address: FIXED_CONTACT.rice.address
};
/* ======================== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function withBiz(path){
  const sep = path.includes("?") ? "&" : "?";
  return S.biz ? `${path}${sep}business=${encodeURIComponent(S.biz)}` : path;
}
async function api(path, opts){ const res = await fetch(`${PROXY_BASE}${withBiz(path)}`, opts); if(!res.ok) throw new Error("failed"); return res.json(); }
function adminHeaders(){ return { "Content-Type":"application/json", "x-admin-password": S.adminPass || "" }; }
function load(k,f){ try{ return JSON.parse(localStorage.getItem(k)) ?? f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- shared motion helpers (used by the navbar spotlight and the count-up) ---------- */
const reduceMotionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
function prefersReducedMotion(){ return !!(reduceMotionQuery && reduceMotionQuery.matches); }

// A small spring animator — the vanilla stand-in for framer-motion's
// animate(from, to, { type:"spring", stiffness, damping }).
function springAnimate(from, to, opts){
  const { stiffness=200, damping=20, mass=1, precision=0.01, onUpdate, onDone } = opts;
  let x = from, v = 0, raf = 0, last = null, stopped = false;
  function step(now){
    if(stopped) return;
    if(last === null) last = now;
    const dt = Math.min((now - last) / 1000, 1/30); last = now;
    const sub = 4, h = dt / sub;                       // a few sub-steps keeps it stable
    for(let i=0;i<sub;i++){
      const a = (-stiffness * (x - to) - damping * v) / mass;
      v += a * h; x += v * h;
    }
    if(Math.abs(x - to) < precision && Math.abs(v) < precision * 2){
      x = to; onUpdate(x); if(onDone) onDone(); return;
    }
    onUpdate(x);
    raf = requestAnimationFrame(step);
  }
  raf = requestAnimationFrame(step);
  return { cancel(){ stopped = true; cancelAnimationFrame(raf); } };
}

const S = {
  view:"home", products:null, productsError:false, SHOP:DEFAULT_SHOP,
  cart:{}, showRequestForm:false, isAdmin:false, adminPass:load("adminPass",null), adminError:false,
  requests:null, unseen:0, contentExpanded:false, productsLoading:false,
  extraChecked:{}, extraTotal:{}, maxNotice:{}, mapSatellite:false,
  businesses:null, biz:load("biz",null)
};

/* ---------- count-up numbers (vanilla port of the "CountUp" component) ----------
   Numbers count up from 0 the first time they scroll into view. Progress is
   remembered per key, so the page's frequent re-renders never restart a count
   that's already running or finished. */
const countState = {};   // key -> { to, value, status: "idle" | "run" | "done" }
function decimalsOf(n){
  const s = String(n);
  if(s.indexOf(".") >= 0){ const d = s.split(".")[1]; if(parseInt(d,10) !== 0) return d.length; }
  return 0;
}
function fmtCount(n, dec){ return dec ? Number(n).toFixed(dec) : String(Math.round(n)); }
function countHtml(key, to){
  const st = countState[key];
  const shown = (st && st.to === to) ? st.value : 0;
  return `<span class="countup" data-key="${esc(key)}" data-to="${to}" data-dec="${decimalsOf(to)}">${fmtCount(shown, decimalsOf(to))}</span>`;
}
function setCountText(key, text){
  document.querySelectorAll(".countup").forEach(el=>{ if(el.dataset.key === key) el.textContent = text; });
}
function startCount(key, to, dec){
  const st = countState[key];
  if(!st || st.status !== "idle") return;
  st.status = "run";
  const duration = 1.4;                                   // seconds until it has fully settled
  const w = 7.6 / duration;                               // critically damped: smooth, no overshoot, lands on time
  springAnimate(0, to, {
    stiffness: w * w, damping: 2 * w, precision: Math.max(0.004, Math.pow(10, -dec) / 2),
    onUpdate: v=>{ st.value = v; setCountText(key, fmtCount(v, dec)); },
    onDone: ()=>{ st.value = to; st.status = "done"; setCountText(key, fmtCount(to, dec)); }
  });
}
let countObserver = null;
function runCountUps(){
  document.querySelectorAll(".countup").forEach(el=>{
    const key = el.dataset.key, to = parseFloat(el.dataset.to), dec = parseInt(el.dataset.dec,10) || 0;
    let st = countState[key];
    if(!st || st.to !== to) st = countState[key] = { to, value:0, status:"idle" };   // new number → count again
    if(st.status !== "idle") return;                       // running or finished: element already shows the right text
    if(prefersReducedMotion() || !window.IntersectionObserver){
      st.value = to; st.status = "done"; setCountText(key, fmtCount(to, dec)); return;
    }
    if(!countObserver){
      countObserver = new IntersectionObserver(entries=>{
        entries.forEach(en=>{
          if(!en.isIntersecting) return;
          countObserver.unobserve(en.target);
          const k = en.target.dataset.key;
          if(countState[k]) startCount(k, countState[k].to, parseInt(en.target.dataset.dec,10) || 0);
        });
      });
    }
    countObserver.observe(el);
  });
}

/* ---------- WarpText (vanilla WebGL2 port of the "WarpText" component) ----------
   Draws a line of text onto a canvas, uploads it as a texture and warps it in a
   fragment shader: slow drifting noise, a lens/ripple that follows the pointer
   (and wanders by itself when nobody is pointing), plus a slight colour split.
   If WebGL2 isn't available the plain text underneath is simply left visible. */
const WARP_VERT = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const WARP_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform vec2 uPointer;
uniform float uPointerActive;
uniform float uTime;
uniform float uWarp;
uniform float uScale;
uniform float uSpeed;
uniform float uInfluence;
uniform float uStrength;
uniform float uRefraction;
uniform float uRipple;
uniform float uMotion;
in vec2 vUv;
out vec4 outColor;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 4; i++){ v += a * vnoise(p); p *= 2.02; a *= 0.5; }
  return v;
}
vec4 tex(vec2 uv){
  if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);
  return texture(uTex, uv);
}
void main(){
  vec2 uv = vUv;
  float aspect = uRes.x / max(uRes.y, 1.0);
  float t = uTime * uSpeed;
  float sc = max(uScale, 0.001);

  // slow ambient wobble
  vec2 drift = vec2(t * 0.055, -t * 0.045);
  float n1 = fbm(uv * sc * 3.1 + drift);
  float n2 = fbm((uv + 19.17) * sc * 3.4 - drift.yx);
  vec2 ambient = (vec2(n1, n2) - 0.5) * uWarp * 0.045 * uMotion;

  // lens + ripple around the pointer
  vec2 d = uv - uPointer;
  vec2 ad = vec2(d.x * aspect, d.y);
  float dist = length(ad);
  float radius = max(uInfluence, 0.001);
  float q = clamp(dist / radius, 0.0, 1.0);
  float lens = smoothstep(radius, 0.0, dist) * uPointerActive;
  float bulge = q * (1.0 - q) * (1.0 - q) * 6.75 * uPointerActive;
  vec2 dir = dist > 0.0001 ? vec2(ad.x / aspect, ad.y) / dist : vec2(0.0);
  float wave = sin(dist * 28.0 - t * 4.2) * 0.5 + 0.5;
  float ring = (wave - 0.5) * uRipple;
  vec2 pw = -dir * bulge * uStrength * 0.045;
  pw += dir * ring * bulge * uStrength * 0.016;

  vec2 disp = uv + ambient + pw;
  vec2 sd = ambient + pw;
  float sl = length(sd);
  sd = sl > 0.00001 ? sd / sl : vec2(0.7071);
  vec2 split = sd * uRefraction * 0.16 * (0.35 + lens * 1.65);

  vec4 base = tex(disp);
  vec4 s1 = tex(disp + split);
  vec4 s2 = tex(disp - split);
  float alpha = max(max(s1.a, base.a), s2.a);
  vec3 col = vec3(s1.r, base.g, s2.b) + lens * base.a * 0.055;
  outColor = vec4(min(col, vec3(alpha)), alpha);   // premultiplied
}`;

function warpCompile(gl, type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){ console.warn("WarpText shader:", gl.getShaderInfoLog(sh)); return null; }
  return sh;
}
// Render the text into an offscreen 2D canvas using the container's own font/colour
function warpTextCanvas(container, w, h, dpr, text){
  const cs = getComputedStyle(container);
  let px = parseFloat(cs.fontSize) || 16;
  const family = cs.fontFamily || "sans-serif", weight = cs.fontWeight || "600", color = cs.color || "#000";
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.floor(w * dpr)); c.height = Math.max(1, Math.floor(h * dpr));
  const ctx = c.getContext("2d"); if(!ctx) return c;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  const lines = String(text || "").split("\n");
  const setFont = ()=>{ ctx.font = `${weight} ${px}px ${family}`; };
  setFont();
  const widest = Math.max(1, ...lines.map(l=>ctx.measureText(l).width));
  const lh = px * 1.15;
  const fit = Math.min(1, (w * 0.92) / widest, (h * 0.82) / (lh * lines.length));
  if(fit < 1){ px *= fit; setFont(); }
  const lineH = px * 1.15, startY = h / 2 - (lineH * (lines.length - 1)) / 2;
  lines.forEach((l, i)=>ctx.fillText(l, w / 2, startY + i * lineH));
  return c;
}

function createWarpText(container, initialText, opts){
  opts = Object.assign({ warp:0.3, scale:1.7, speed:0.55, influence:0.5, strength:0.5, refraction:0.03, ripple:true }, opts || {});
  if(!window.WebGL2RenderingContext) return null;
  const canvas = document.createElement("canvas");
  let gl = null;
  try{ gl = canvas.getContext("webgl2", { alpha:true, premultipliedAlpha:true, antialias:true }); }catch(e){}
  if(!gl) return null;

  const vs = warpCompile(gl, gl.VERTEX_SHADER, WARP_VERT), fs = warpCompile(gl, gl.FRAGMENT_SHADER, WARP_FRAG);
  if(!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.warn("WarpText link:", gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);
  const U = {};
  ["uTex","uRes","uPointer","uPointerActive","uTime","uWarp","uScale","uSpeed","uInfluence","uStrength","uRefraction","uRipple","uMotion"]
    .forEach(n=>{ U[n] = gl.getUniformLocation(prog, n); });
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uTex, 0);
  gl.uniform1f(U.uWarp, opts.warp); gl.uniform1f(U.uScale, opts.scale); gl.uniform1f(U.uSpeed, opts.speed);
  gl.uniform1f(U.uInfluence, opts.influence); gl.uniform1f(U.uStrength, opts.strength);
  gl.uniform1f(U.uRefraction, opts.refraction); gl.uniform1f(U.uRipple, opts.ripple ? 1 : 0);
  gl.clearColor(0, 0, 0, 0);

  let text = initialText, disposed = false, lost = false, visible = true, pageVisible = !document.hidden, raf = 0;
  let reduce = prefersReducedMotion();
  const pointer = { x:0.5, y:0.5, tx:0.5, ty:0.5, active:0, target:0 };
  const t0 = performance.now();
  const fallback = container.querySelector(".warp-fallback");

  container.setAttribute("role", "img");
  container.setAttribute("aria-label", text);
  container.appendChild(canvas);
  canvas.setAttribute("aria-hidden", "true");

  const draw = ()=>{ if(disposed || lost) return; gl.viewport(0, 0, canvas.width, canvas.height); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  const rasterize = ()=>{
    if(disposed || lost) return;
    const r = container.getBoundingClientRect(); if(r.width <= 0 || r.height <= 0) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const tc = warpTextCanvas(container, r.width, r.height, dpr, text);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
    if(fallback) fallback.style.display = "none";           // the canvas takes over from the plain text
    draw();
  };
  const resize = ()=>{
    if(disposed || lost) return;
    const r = container.getBoundingClientRect(); if(r.width <= 0 || r.height <= 0) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    rasterize();
  };
  const loop = now=>{
    if(disposed || lost) return;
    const el = (now - t0) * 0.001;
    const idleX = 0.5 + Math.sin(el * 0.33) * 0.12, idleY = 0.5 + Math.cos(el * 0.27) * 0.1;
    const tx = pointer.target > 0 ? pointer.tx : idleX, ty = pointer.target > 0 ? pointer.ty : idleY;
    const damp = pointer.target > 0 ? 0.12 : 0.035;
    pointer.x += (tx - pointer.x) * damp; pointer.y += (ty - pointer.y) * damp;
    pointer.active += ((pointer.target > 0 ? 1 : 0.18) - pointer.active) * 0.06;
    gl.uniform2f(U.uPointer, pointer.x, pointer.y);
    gl.uniform1f(U.uPointerActive, pointer.active);
    gl.uniform1f(U.uTime, el);
    gl.uniform1f(U.uMotion, 1);
    draw();
    raf = requestAnimationFrame(loop);
  };
  const startLoop = ()=>{
    if(reduce){                                              // reduced motion: one still frame, no animation
      gl.uniform1f(U.uMotion, 0); gl.uniform1f(U.uTime, 0); gl.uniform1f(U.uPointerActive, 0.2); draw(); return;
    }
    if(!raf && visible && pageVisible) raf = requestAnimationFrame(loop);
  };
  const stopLoop = ()=>{ if(raf){ cancelAnimationFrame(raf); raf = 0; } };

  const onMove = e=>{
    if(e.pointerType === "touch") return;
    const r = canvas.getBoundingClientRect(); if(r.width <= 0 || r.height <= 0) return;
    pointer.tx = (e.clientX - r.left) / r.width; pointer.ty = 1 - (e.clientY - r.top) / r.height; pointer.target = 1;
  };
  const onLeave = ()=>{ pointer.target = 0; };
  const onLost = e=>{ e.preventDefault(); lost = true; stopLoop(); if(fallback) fallback.style.display = ""; canvas.remove(); };
  const onVis = ()=>{ pageVisible = !document.hidden; pageVisible ? startLoop() : stopLoop(); };
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerleave", onLeave);
  canvas.addEventListener("webglcontextlost", onLost, false);
  document.addEventListener("visibilitychange", onVis);
  const ro = window.ResizeObserver ? new ResizeObserver(resize) : null; if(ro) ro.observe(container);
  const io = window.IntersectionObserver ? new IntersectionObserver(([en])=>{ visible = en.isIntersecting; visible ? startLoop() : stopLoop(); }) : null;
  if(io) io.observe(container);

  resize(); startLoop();

  return {
    setText(t){ text = t; container.setAttribute("aria-label", t); rasterize(); },
    refresh(){ reduce = prefersReducedMotion(); rasterize(); },
    destroy(){
      disposed = true; stopLoop();
      if(ro) ro.disconnect(); if(io) io.disconnect();
      document.removeEventListener("visibilitychange", onVis);
      canvas.removeEventListener("pointermove", onMove); canvas.removeEventListener("pointerleave", onLeave);
      canvas.removeEventListener("webglcontextlost", onLost);
      try{ gl.deleteTexture(tex); gl.deleteProgram(prog); const x = gl.getExtension("WEBGL_lose_context"); if(x) x.loseContext(); }catch(e){}
      canvas.remove();
    }
  };
}

// Every render() rebuilds the page's HTML, so loaders are re-created often: attach a
// WarpText to any new ".warp-load" element and clean up the ones that were thrown away.
const warpInstances = new Map();
function mountWarpTexts(){
  warpInstances.forEach((inst, el)=>{ if(!el.isConnected){ inst.destroy(); warpInstances.delete(el); } });
  document.querySelectorAll(".warp-load").forEach(el=>{
    if(warpInstances.has(el) || el.dataset.warp === "failed") return;
    const text = el.dataset.text || el.textContent.trim();
    const inst = createWarpText(el, text);
    if(inst) warpInstances.set(el, inst); else el.dataset.warp = "failed";
  });
}
function refreshWarpTexts(){ warpInstances.forEach(inst=>inst.refresh()); }

function stockBadge(stock, key){
  if(stock<=0) return `<span class="stock out">Out of stock</span>`;
  const n = key ? countHtml(key, stock) : String(stock);
  if(stock<=5) return `<span class="stock low">${n} left</span>`;
  return `<span class="stock ok">${n} in stock</span>`;
}
function skeleton(n){ return Array.from({length:n},()=>'<div class="sk"></div>').join(""); }
const LOAD_MESSAGES = [
  "Fetching today's stock…",
  "Weighing the rice and sugar…",
  "Talking to the billing system…",
  "Almost there…"
];
let loadMsgTimer = null;
let loadMsgIndex = 0;
function startLoadMessages(){
  if(loadMsgTimer) return; // already running
  loadMsgTimer = setInterval(()=>{
    const els = document.querySelectorAll(".loadmsg.rot");
    if(!els.length){ stopLoadMessages(); return; }
    loadMsgIndex = (loadMsgIndex+1) % LOAD_MESSAGES.length;
    const text = LOAD_MESSAGES[loadMsgIndex];
    els.forEach(el=>{
      el.style.opacity = 0;
      setTimeout(()=>{
        if(!el.isConnected) return;
        const inst = warpInstances.get(el);
        if(inst) inst.setText(text); else el.textContent = text;   // warped canvas text, or plain text if WebGL isn't available
        el.style.opacity = 1;
      }, 250);
    });
  }, 2200);
}
function stopLoadMessages(){ if(loadMsgTimer){ clearInterval(loadMsgTimer); loadMsgTimer = null; } loadMsgIndex = 0; }

/* ---------- spotlight navbar behaviour ---------- */
const navFx = {
  spot:{ x:0, target:null, anim:null },   // follows the pointer
  amb: { x:0, target:null, anim:null },   // sits under the active tab
  ready:false, hovering:false
};
function navEl(){ return document.getElementById("nav"); }
function navItemCenter(el){
  const n = navEl().getBoundingClientRect(), r = el.getBoundingClientRect();
  return r.left - n.left + r.width / 2;
}
function navSetVar(slot, cssVar, v){ navFx[slot].x = v; navEl().style.setProperty(cssVar, v + "px"); }
function navMove(slot, cssVar, target, animated){
  const s = navFx[slot];
  if(s.target !== null && Math.abs(s.target - target) < 0.5) return;   // already heading there
  s.target = target;
  if(s.anim){ s.anim.cancel(); s.anim = null; }
  if(!animated || prefersReducedMotion()){ navSetVar(slot, cssVar, target); return; }
  s.anim = springAnimate(s.x, target, { stiffness:200, damping:20, precision:0.05,
    onUpdate:v=>navSetVar(slot, cssVar, v), onDone:()=>{ s.anim = null; } });
}
// Re-aim the glow line under whichever tab is active (called after every nav render / resize)
function syncNavAmbience(){
  const nav = navEl(); if(!nav) return;
  const active = nav.querySelector('button[aria-current="true"]');
  nav.classList.toggle("no-active", !active);
  if(!active) return;
  const t = navItemCenter(active);
  if(!navFx.ready){
    navFx.ready = true;
    navMove("amb", "--ambience-x", t, false);
    navMove("spot", "--spotlight-x", t, false);
    return;
  }
  navMove("amb", "--ambience-x", t, true);
  if(!navFx.hovering) navMove("spot", "--spotlight-x", t, true);
}
function initNavSpotlight(){
  const nav = navEl();
  nav.addEventListener("mousemove", e=>{
    navFx.hovering = true;
    nav.classList.add("spot-on");
    const x = e.clientX - nav.getBoundingClientRect().left;
    if(navFx.spot.anim){ navFx.spot.anim.cancel(); navFx.spot.anim = null; }
    navFx.spot.target = x;                 // direct update: no spring, so it feels snappy
    navSetVar("spot", "--spotlight-x", x);
  });
  nav.addEventListener("mouseleave", ()=>{
    navFx.hovering = false;
    nav.classList.remove("spot-on");
    const active = nav.querySelector('button[aria-current="true"]');
    if(active) navMove("spot", "--spotlight-x", navItemCenter(active), true);   // spring back to the active tab
  });
  if(window.ResizeObserver) new ResizeObserver(()=>syncNavAmbience()).observe(nav);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ navFx.amb.target = null; navFx.spot.target = null; syncNavAmbience(); });
}

      <input type="number" min="${q+1}" inputmode="numeric" data-extratotal="${esc(p.id)}" value="${total}" placeholder="e.g. ${q+5}">

// Rebuild only the extra section of one row (keeps focus in the quantity box while typing)
function refreshRowExtra(id){
  const row = document.querySelector(`[data-row="${CSS.escape(id)}"]`); if(!row) return;
  const p = (S.products||[]).find(x=>x.id===id); if(!p) return;
  const old = row.querySelector(".extra-box"); if(old) old.remove();
  const html = extraBoxHtml(p);
  if(html) row.insertAdjacentHTML("beforeend", html);
}
function clearItem(id){
  delete S.cart[id]; delete S.extraChecked[id]; delete S.extraTotal[id]; delete S.maxNotice[id];

function clearCart(){ S.cart={}; S.extraChecked={}; S.extraTotal={}; S.maxNotice={}; }
async function loadProducts(){
  if(S.productsLoading) return; // avoid duplicate concurrent fetches
  S.productsLoading = true;
  // Render's free tier can take a while to wake a sleeping service (or two,
  // if this proxy has to wait on your billing backend waking up too) — keep
  // trying quietly instead of giving up after one failed attempt.
  const delays = [3000, 6000, 10000, 15000, 20000]; // ~54s of patience in total
  for(let attempt=0; attempt<=delays.length; attempt++){
    try{
      S.products = await api("/products");
      S.productsError = false;
      break;
    }catch(e){
      S.productsError = true;
      if(attempt < delays.length) await new Promise(r=>setTimeout(r, delays[attempt]));
    }
  }
  S.productsLoading = false;
  stopLoadMessages();
  render();
}

const REQ_STATUS_LABEL = { new:"Sent", seen:"Seen", confirmed:"Confirmed", done:"Completed", cancelled:"Cancelled" };
const STATUS_KEYS = ["new","seen","confirmed","done","cancelled"];
function statusPill(s){ return `<span class="pill st-${esc(s)}">${esc(REQ_STATUS_LABEL[s] || s)}</span>`; }
// One product line inside a request. Items with no extra look like before.
// Items with extra show "stock part" and "extra part", each with its own status
// (falling back to the request's overall status until the admin marks them).
function itemLineHtml(i, reqStatus, admin, reqId, idx){
  const extra = Number(i.extra)||0;
  if(!extra) return `<li><span>${esc(i.name)}</span><span>${fmtNum(i.qty)} ${esc(i.unit)}</span></li>`;
  const sStatus = i.stockStatus || reqStatus;
  const eStatus = i.extraStatus || reqStatus;
  const ctrl = (part, cur) => admin
    ? `<select class="statsel" data-partreq="${esc(reqId)}" data-item="${idx}" data-part="${part}" aria-label="Status of the ${part} part">${STATUS_KEYS.map(k=>`<option value="${k}" ${k===cur?"selected":""}>${REQ_STATUS_LABEL[k]}</option>`).join("")}</select>`
    : "";
  return `<li class="has-extra">
    <div class="xhead"><span>${esc(i.name)}</span><span class="meta">${fmtNum(i.qty)} + ${fmtNum(extra)} ${esc(i.unit)} (total ${fmtNum(Number(i.qty)+extra)})</span></div>
    <div class="xpart"><span class="xlabel">From stock</span><b>${fmtNum(i.qty)} ${esc(i.unit)}</b>${statusPill(sStatus)}${ctrl("stock", sStatus)}</div>
    <div class="xpart"><span class="xlabel">Extra</span><b>${fmtNum(extra)} ${esc(i.unit)}</b>${statusPill(eStatus)}${ctrl("extra", eStatus)}</div>
  </li>`;
}
async function runLookup(phone){

  invBox.innerHTML = `<div class="loadwrap" style="padding:8px 10px 20px"><p class="loadmsg">Fetching your bills from the billing system…</p></div>`;

  try{
    const myReqs = await api(`/my-requests?phone=${encodeURIComponent(phone)}`);
    if(!myReqs.length){ reqBox.innerHTML = ""; }
    else {
      reqBox.innerHTML = `<h3 style="margin-bottom:8px">Your requests</h3>` + myReqs.map(r => `

  try{

    if(!invoices.length){ invBox.innerHTML = ""; }
    else {
      invBox.innerHTML = `<h3 style="margin-bottom:8px">Your bills</h3>` + invoices.map(inv => `
        <div class="inv">
          <div class="inv-top">
            <span class="code">#${esc(inv.invoiceNumber)}</span>

    }
  }catch(e){ invBox.innerHTML = `<div class="empty">Couldn't look up your bills right now.</div>`; }

  if(!reqBox.innerHTML && !invBox.innerHTML){
    reqBox.innerHTML = `<div class="empty">No requests or bills found for that number yet.</div>`;
  }
}

async function switchBusiness(key){
  if(key === S.biz || S.switchingBiz) return;
  S.switchingBiz = true;
  const outer = document.getElementById("slidesOuter");
  const sw = document.getElementById("bizSwitcher");
  if(sw) sw.disabled = true;

  // Smooth crossfade: fade the current content down first, swap all the
  // data for the new business while it's faded, then fade the freshly
  // rendered content back in — so switching never jumps straight to an
  // empty skeleton or snaps instantly between two different businesses.
  outer.classList.add("biz-fade");
  await new Promise(r=>setTimeout(r, 220));

  S.biz = key; save("biz", key);
  S.products = null; S.productsError = false;
  S.requests = null;
  S.SHOP = DEFAULT_SHOP;
  clearCart();
  S.view = "home";
  await loadContent();
  await loadProducts();
  render();

  outer.classList.remove("biz-fade");
  if(sw) sw.disabled = false;
  S.switchingBiz = false;
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]"); if(tab){ S.view = (tab.dataset.tab==="login" && S.isAdmin) ? "admin" : tab.dataset.tab; render(); return; }
  const dot = e.target.closest("[data-godot]"); if(dot){ S.view=dot.dataset.godot; render(); return; }

  const inc = e.target.closest("[data-inc]"); if(inc){
    const id=inc.dataset.inc;
    const p=(S.products||[]).find(x=>x.id===id); const cur=S.cart[id]||0;
    if(p && cur >= p.stock){ S.maxNotice[id]=true; }            // at the limit: explain instead of exceeding it
    else { S.cart[id]=cur+1; S.maxNotice[id]=false; }
    render(); return;
  }
  const dec = e.target.closest("[data-dec]"); if(dec){
    const id=dec.dataset.dec; const next=Math.max(0,(S.cart[id]||0)-1);
    if(next) { S.cart[id]=next; S.maxNotice[id]=false; } else clearItem(id);
    render(); return;
  }
  if(e.target.id==="traygo"){
    // an "extra" box that's ticked but has no valid total would silently request nothing extra — flag it
    const bad = Object.keys(S.cart).filter(id=>S.cart[id]>0 && S.extraChecked[id] && !(S.extraTotal[id] > S.cart[id]));
    if(bad.length){
      const names = bad.map(id=>((S.products||[]).find(p=>p.id===id)||{}).name||"an item");
      alert(`For ${names.join(", ")}: enter a total quantity higher than the amount taken from stock, or untick "I need more than what's in stock".`);
      return;
    }
    S.showRequestForm=true; render(); return;
  }
  if(e.target.id==="trayclear"){ clearCart(); render(); return; }

  if(e.target.id==="backToProducts"){ S.showRequestForm=false; render(); return; }
  if(e.target.id==="lookupBtn"){ runLookup(document.getElementById("phoneInput").value); return; }

  const setreq = e.target.closest("[data-setreq]");
  if(setreq){ api(`/requests/${setreq.dataset.setreq}`, { method:"PATCH", headers:adminHeaders(), body:JSON.stringify({status:setreq.dataset.status}) })
    .then(()=>loadRequests()).catch(()=>{}); return; }

  const delreq = e.target.closest("[data-delreq]");
  if(delreq){
    if(!confirm("Delete this request permanently? This can't be undone.")) return;
    api(`/requests/${delreq.dataset.delreq}`, { method:"DELETE", headers:adminHeaders() })
      .then(()=>loadRequests()).catch(()=>alert("Couldn't delete — check your admin PIN is still correct."));
    return;
  }

  if(e.target.id==="toggleContent"){ S.contentExpanded = !S.contentExpanded; render(); return; }
  const quick = e.target.closest("[data-quickadd]");
  if(quick){
    const id = quick.dataset.quickadd;
    const p = (S.products||[]).find(x=>x.id===id);
    if(p && p.stock>0) S.cart[id] = Math.min(p.stock, (S.cart[id]||0)+1);
    S.view = "products";
    render();
    return;
  }
  const mapBtn = e.target.closest("#mapToggle");
  if(mapBtn){
    // Direct DOM update only — never call render() here, or the whole
    // page (and the iframe itself) would be torn down and rebuilt just
    // to change one map's view.
    S.mapSatellite = !S.mapSatellite;
    const iframe = mapBtn.parentElement.querySelector("iframe");
    if(iframe) iframe.src = mapSrc(S.mapSatellite);
    mapBtn.textContent = S.mapSatellite ? "🗺️ Map" : "🛰️ Satellite";
    return;
  }
  const eye = e.target.closest("#lgEye"); if(eye){
    const inp = document.getElementById("lg-p");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    eye.textContent = show ? "🙈" : "👁";
    eye.setAttribute("aria-label", show ? "Hide PIN" : "Show PIN");
    return;
  }
  if(e.target.id==="adminLogout"){ S.isAdmin=false; S.adminPass=null; save("adminPass",null); S.view="home"; render(); return; }
});

function updateTray(){

document.addEventListener("input", e=>{
  // --- typing the "total needed" box for extra stock ---
  const et = e.target.closest("[data-extratotal]");
  if(et){
    const id = et.dataset.extratotal;
    const v = parseFloat(et.value);
    if(isNaN(v)) delete S.extraTotal[id]; else S.extraTotal[id] = v;
    const p = (S.products||[]).find(x=>x.id===id);
    const hint = et.parentElement.querySelector(".extra-hint");
    if(p && hint) hint.textContent = extraHintText(p);
    return;
  }
  // --- typing the quantity taken from stock ---
  const q = e.target.closest("[data-qty]"); if(!q) return;
  const id = q.dataset.qty;
  const p = (S.products||[]).find(x=>x.id===id);
  const max = p ? p.stock : Infinity;
  const raw = q.value;
  if(raw === ""){ return; } // let them clear the box while typing without snapping it back
  let n = Math.max(0, parseInt(raw,10) || 0);
  let clamped = false;
  if(n > max){ n = max; q.value = n; clamped = true; } // over the stock: switch to the maximum and say so
  if(n) S.cart[id] = n; else clearItem(id);
  S.maxNotice[id] = clamped && n > 0;
  const row = q.closest(".row");
  if(row) row.querySelector("[data-dec]").disabled = !n;
  refreshRowExtra(id);
  updateTray();
});

  const order = slideOrder(); const i = order.indexOf(S.view);
  if(dx<0 && i<order.length-1){ S.view=order[i+1]; render(); }
  else if(dx>0 && i>0){ S.view=order[i-1]; render(); }
}, {passive:true});

/* ---------- theme toggle ---------- */
function applyThemeButton(){
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const cb = document.getElementById("themeToggle");
  cb.checked = isDark;
  cb.closest(".theme-switch").setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
}
document.getElementById("themeToggle").addEventListener("change", (e)=>{
  if(e.target.checked){ document.documentElement.setAttribute("data-theme","dark"); try{ localStorage.setItem("theme","dark"); }catch(err){} }
  else{ document.documentElement.removeAttribute("data-theme"); try{ localStorage.setItem("theme","light"); }catch(err){} }
  applyThemeButton();
  refreshWarpTexts();            // re-draw warped text in the new theme's text colour
});
applyThemeButton();

function applyTextSizeButton(){
  const isLarge = document.documentElement.getAttribute("data-textsize") === "lg";
  const btn = document.getElementById("textSizeToggle");
  btn.setAttribute("aria-label", isLarge ? "Decrease text size" : "Increase text size");
  btn.style.fontWeight = isLarge ? "800" : "600";
}
document.getElementById("textSizeToggle").addEventListener("click", ()=>{
  const isLarge = document.documentElement.getAttribute("data-textsize") === "lg";
  if(isLarge){ document.documentElement.removeAttribute("data-textsize"); try{ localStorage.setItem("textSize","normal"); }catch(e){} }
  else{ document.documentElement.setAttribute("data-textsize","lg"); try{ localStorage.setItem("textSize","lg"); }catch(e){} }
  applyTextSizeButton();
  refreshWarpTexts();
});
applyTextSizeButton();

/* ---------- boot ---------- */
initNavSpotlight();
render();
function hideLoader(){
  const l=document.getElementById("loader"); if(l) l.classList.add("gone");
  const v=document.getElementById("loaderVideo");
  if(v){ try{ v.pause(); }catch(e){} }
}
document.getElementById("skipLoad").addEventListener("click", hideLoader); // Skip always jumps straight in, regardless of video state
const loaderVideo = document.getElementById("loaderVideo");
const unmuteBtn = document.getElementById("unmuteLoad");

// Only play the intro video on a genuinely fresh visit — not on a
// page refresh within the same tab/session.
let alreadyPlayed = false;
try{ alreadyPlayed = sessionStorage.getItem("loaderPlayed") === "1"; }catch(e){}

if(alreadyPlayed){
  hideLoader();
} else {
  try{ sessionStorage.setItem("loaderPlayed","1"); }catch(e){} // set immediately so a mid-video refresh doesn't replay it
  loaderVideo.addEventListener("ended", hideLoader);   // loading screen switches on its own once the video finishes
  loaderVideo.addEventListener("error", hideLoader);   // if the video file can't load for some reason, don't get stuck
  unmuteBtn.addEventListener("click", ()=>{ loaderVideo.muted = false; loaderVideo.play().catch(()=>{}); unmuteBtn.style.display = "none"; });
  loaderVideo.muted = false;
  try{
    const p = loaderVideo.play();
    if(p && p.then) p.then(()=>{ unmuteBtn.style.display = "none"; }).catch(()=>{
      loaderVideo.muted = true;
      try{ loaderVideo.play(); }catch(e){}
    });
  }catch(e){}
  setTimeout(hideLoader, 20000); // safety net only — shouldn't normally fire
}

(async function(){
  await loadBusinesses();
  await loadContent();
  if(S.adminPass){
    const res = await fetch(`${PROXY_BASE}${withBiz("/requests")}`, { headers:{ "x-admin-password":S.adminPass } }).catch(()=>null);
    if(res && res.ok) S.isAdmin = true;
  }
  await loadProducts();
  render();
})();
</script>
